<?xml version="1.0"?>
<svg width="128" height="128" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
  <title>Documents &amp; invoices AI</title>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"></stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"></stop>
    </linearGradient>
    <style>
      @keyframes badgePulse{0%,100%{opacity:.6}50%{opacity:1}}
      .badge{animation:badgePulse 3s ease-in-out infinite; transform-origin:center;}
      @keyframes sweep{0%,100%{transform:translateY(-6px); opacity:.3}50%{transform:translateY(6px); opacity:.9}}
      .sweep{animation:sweep 2.4s ease-in-out infinite;}
    </style>
  </defs>
  <g class="badge">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#grad)" stroke="rgba(56,189,248,0.4)" stroke-width="1"></rect>
  </g>
  <g transform="translate(10,10)">

    <path d="M8 4 h9 l5 5 v19 h-14 z" fill="#eaf6ff" fill-opacity="0.1" stroke="#eaf6ff" stroke-opacity="0.85" stroke-width="1.4"></path>
    <line x1="10.5" y1="15" x2="19.5" y2="15" stroke="#eaf6ff" stroke-opacity="0.7" stroke-width="1.1"></line>
    <line x1="10.5" y1="19" x2="19.5" y2="19" stroke="#eaf6ff" stroke-opacity="0.7" stroke-width="1.1"></line>
    <rect x="8" y="12.5" width="14" height="2" fill="#38bdf8" opacity="0.7" class="sweep"></rect>
  </g>
</svg>