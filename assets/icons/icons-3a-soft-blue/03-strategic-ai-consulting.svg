<?xml version="1.0"?>
<svg width="128" height="128" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
  <title>Strategic AI consulting</title>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"></stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"></stop>
    </linearGradient>
    <style>
      @keyframes badgePulse{0%,100%{opacity:.6}50%{opacity:1}}
      .badge{animation:badgePulse 3s ease-in-out infinite; transform-origin:center;}
      @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      .spin{animation:spin 6s linear infinite;}
    </style>
  </defs>
  <g class="badge">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#grad)" stroke="rgba(56,189,248,0.4)" stroke-width="1"></rect>
  </g>
  <g transform="translate(10,10)">

    <circle cx="16" cy="16" r="11" stroke="#eaf6ff" stroke-opacity="0.85" stroke-width="1.5" fill="none"></circle>
    <g class="spin" style="transform-origin:16px 16px">
      <path d="M16 6 L18.5 16 L16 26 L13.5 16 Z" fill="#eaf6ff" fill-opacity="0.9"></path>
      <circle cx="16" cy="16" r="2" fill="#38bdf8"></circle>
    </g>
  </g>
</svg>