<?xml version="1.0"?>
<svg width="128" height="128" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
  <title>Custom AI agents</title>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"></stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"></stop>
    </linearGradient>
    <style>
      @keyframes badgePulse{0%,100%{opacity:.6}50%{opacity:1}}
      .badge{animation:badgePulse 3s ease-in-out infinite; transform-origin:center;}
      @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
      .blink{animation:blink 1.6s ease-in-out infinite;}
    </style>
  </defs>
  <g class="badge">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#grad)" stroke="rgba(56,189,248,0.4)" stroke-width="1"></rect>
  </g>
  <g transform="translate(10,10)">

    <rect x="4" y="6" width="24" height="16" rx="6" fill="#eaf6ff" fill-opacity="0.12" stroke="#eaf6ff" stroke-opacity="0.85" stroke-width="1.5"></rect>
    <path d="M10 22 L7 27 L14 22" fill="#eaf6ff" fill-opacity="0.12" stroke="#eaf6ff" stroke-opacity="0.85" stroke-width="1.5"></path>
    <circle cx="12" cy="14" r="1.6" fill="#eaf6ff"></circle>
    <circle cx="20" cy="14" r="1.6" fill="#eaf6ff"></circle>
    <circle cx="27" cy="7" r="2.1" fill="#38bdf8" class="blink"></circle>
  </g>
</svg>