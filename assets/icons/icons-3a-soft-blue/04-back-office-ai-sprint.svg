<?xml version="1.0"?>
<svg width="128" height="128" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
  <title>Back-office AI sprint</title>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"></stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"></stop>
    </linearGradient>
    <style>
      @keyframes badgePulse{0%,100%{opacity:.6}50%{opacity:1}}
      .badge{animation:badgePulse 3s ease-in-out infinite; transform-origin:center;}
      @keyframes blinkSlow{0%,100%{opacity:.35}50%{opacity:1}}
      .blinkSlow{animation:blinkSlow 2.6s ease-in-out infinite;}
    </style>
  </defs>
  <g class="badge">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#grad)" stroke="rgba(56,189,248,0.4)" stroke-width="1"></rect>
  </g>
  <g transform="translate(10,10)">

    <circle cx="16" cy="16" r="9" stroke="#eaf6ff" stroke-opacity="0.7" stroke-width="1.4" fill="none"></circle>
    <path d="M17 9 L11 18 L14.5 18 L13 24 L21 14 L16.5 14 Z" fill="#38bdf8" class="blinkSlow"></path>
  </g>
</svg>